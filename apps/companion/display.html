<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // Set the theme before anything paints, so a light-theme device never flashes dark. See src/lib/theme.ts.
      try {
        var t = localStorage.getItem("mimicbox:theme");
        if (t === "device") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        if (t !== "light") t = "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#241A26" />
    <meta name="description" content="Mimic Box: a free character sheet that lives on your device." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Mimic Box table display</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Mimic Box needs JavaScript to run.</noscript>
    <script type="module" src="./src/display/main.tsx"></script>
  </body>
</html>
